# Pings the Render backend so the free instance doesn't fall asleep
# (it sleeps after 15 minutes idle and then takes ~30s+ to wake).
# GitHub pauses scheduled workflows after 60 days with no repo activity;
# re-enable it from the Actions tab if that happens.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 \
            https://mysurubus-backend.onrender.com/health
