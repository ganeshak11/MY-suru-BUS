services:
  # ─── Backend API (Node.js) ───────────────────────────────────────────────────
  - type: web
    name: mysurubus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                      # Render free tier
    region: singapore               # Closest free region to India
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mysurubus-prod-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true         # Render auto-generates a secure secret
      - key: ALLOWED_ORIGINS
        value: "*"                  # TODO: replace with your Vercel URL after deploying admin dashboard
      - key: LOG_LEVEL
        value: info
      - key: OSRM_BASE_URL
        value: ""                   # blank = use public OSRM demo server

databases:
  # ─── PostgreSQL (Render free tier — 90 day expiry, then upgrade) ─────────────
  - name: mysurubus-prod-db
    plan: free                      # 1 GB storage, 97 connection limit
    databaseName: mysurubus_prod
    user: mysurubus
    region: singapore
