services:
  # ─── Backend API (Node.js) ───────────────────────────────────────────────────
  - type: web
    name: mysurubus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                      # Render free tier
    region: singapore               # Closest free region to India
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false                 # Neon connection string, set in the Render dashboard
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true         # Render auto-generates a secure secret
      - key: ALLOWED_ORIGINS
        value: "https://my-suru-bus.vercel.app"
      - key: LOG_LEVEL
        value: info
      - key: OSRM_BASE_URL
        value: ""                   # blank = use public OSRM demo server

# The database is hosted on Neon (free tier, no expiry), not on Render:
# Render's free Postgres expires, which took the demo down.
